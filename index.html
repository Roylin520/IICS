<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>資通安全概論 — 陪讀系統</title>
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --brand:#1d4ed8; --brand-soft:#dbeafe; --ok:#059669; --ok-soft:#d1fae5;
  --bad:#b91c1c; --bad-soft:#fee2e2; --warn:#d97706; --warn-soft:#fef3c7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
header{background:var(--brand);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:1.1rem;font-weight:700}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.95rem;font-family:inherit}
nav button.active{background:#fff;color:var(--brand);font-weight:700}
#menutoggle{display:none;margin-left:auto;background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 16px;border-radius:8px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer}
.navsub{display:none}
.navrow{display:contents}
.navexp{display:none}
@media (max-width:640px){
  header h1{font-size:1rem}
  #menutoggle{display:block}
  nav{position:absolute;top:100%;left:12px;right:12px;flex-direction:column;flex-wrap:nowrap;background:var(--brand);border-radius:0 0 12px 12px;padding:8px;gap:5px;box-shadow:0 10px 24px rgba(0,0,0,.28);display:none;z-index:20;max-height:calc(100vh - 80px);overflow-y:auto}
  nav.open{display:flex}
  nav button{width:100%;text-align:left;padding:12px 16px;font-size:1.02rem;background:rgba(255,255,255,.12)}
  nav.open .navrow{display:flex;gap:5px}
  nav.open .navrow .navtab{flex:1;width:auto}
  nav.open .navexp{display:flex;align-items:center;justify-content:center;flex:none;width:52px;padding:0;font-size:1.4rem;font-weight:800;background:rgba(255,255,255,.28)}
  nav.open .navsub{display:block;padding:9px 16px 9px 34px;font-size:.94rem;background:rgba(255,255,255,.06)}
  nav.open .navsub.active{background:#fff;color:var(--brand);font-weight:700}
}
main{max-width:1000px;margin:0 auto;padding:20px}
main.wide{max-width:none;padding:14px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
h2{font-size:1.05rem;margin-bottom:10px}
h3{font-size:1rem;margin-bottom:6px}
.muted{color:var(--muted);font-size:.88rem}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.b-blue{background:var(--brand-soft);color:var(--brand)} .b-ok{background:var(--ok-soft);color:var(--ok)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-gray{background:#f3f4f6;color:var(--muted)}
button.act{background:var(--brand);color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:.95rem;font-family:inherit}
button.act:disabled{opacity:.4;cursor:default}
button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.92rem;font-family:inherit}
button.sm{padding:4px 12px;font-size:.85rem}
/* 長得像 ghost 鈕的連結（另開分頁用，可中鍵／Ctrl+點） */
a.ghost{display:inline-block;background:#fff;color:var(--brand);border:1px solid var(--brand);border-radius:8px;
  padding:8px 16px;font-size:.92rem;font-family:inherit;text-decoration:none;white-space:nowrap}
a.ghost.sm{padding:4px 12px;font-size:.85rem}
a.ghost:hover{background:var(--brand-soft)}
.bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
/* reader */
.reader{display:grid;grid-template-columns:240px 1fr;gap:12px}
.toc{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow-y:auto;padding:12px}
.bm{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-top:6px;border:1px solid var(--line);border-left:6px solid var(--bc,#1d4ed8);border-radius:8px;background:#fff;cursor:pointer;font-weight:700;font-size:.9rem;transition:transform .12s}
.bm:hover{transform:translateX(3px)}
.bm.open{background:var(--brand-soft);border-color:var(--brand);border-left-color:var(--bc)}
.bm-no{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;background:var(--bc,#1d4ed8);color:#fff;font-size:.78rem}
.bm-s{display:flex;justify-content:space-between;gap:6px;padding:5px 8px 5px 24px;border-radius:6px;font-size:.86rem;color:var(--ink);cursor:pointer}
.bm-s:hover{background:var(--brand-soft)}
.bm-s.cur{background:var(--brand-soft);font-weight:700}
.bm-s .pg{color:var(--muted);font-size:.78rem;white-space:nowrap}
.pdfwrap{padding:0;overflow:hidden}
.pdfwrap iframe{display:block;width:100%;height:calc(100vh - 150px);border:none}
/* 收合左側章節 → 閱讀區佔滿寬度 */
.reader.notoc{grid-template-columns:1fr}
.reader.notoc>.toc{display:none}
/* 讀物列（課程簡報）＋說明橫幅 */
.docsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.docbtn{background:#fff;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.88rem}
.docbtn.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
/* 從重點跳到某張投影片時，章節欄上方的小返回鈕 */
.backstart{display:block;width:100%;margin-bottom:6px;padding:5px 8px;border:1px solid #93c5fd;
  background:var(--brand-soft);color:var(--brand);border-radius:7px;cursor:pointer;
  font-family:inherit;font-size:.82rem;font-weight:700}
.backstart:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
/* 簡報頁碼跳頁連結（重點內文中的「簡報 D-PP」） */
.slideref{color:#7c3aed;font-weight:700;cursor:pointer;border-bottom:1px dashed #7c3aed;padding:0 1px}
.slideref:hover{background:#7c3aed;color:#fff;border-bottom-color:transparent;border-radius:3px}
/* notes 重點複習 */
.upill{min-width:34px;height:34px;border-radius:9px;border:2px solid var(--uc);background:#fff;color:var(--uc);font-weight:800;cursor:pointer;font-family:inherit;font-size:.95rem}
.upill.on{background:var(--uc);color:#fff}
.upills{display:flex;gap:6px;flex-wrap:wrap}
/* 重點頁「教材版／簡報版」來源切換 */
.srctab{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--muted);
  font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.srctab:hover{border-color:var(--brand);color:var(--brand)}
.srctab.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (max-width:640px){.upills{display:none}}
.kp{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:#fff}
.kp-h{font-weight:700;font-size:.96rem}
.kp-b{margin-top:6px;font-size:.92rem;color:#374151;border-top:1px dashed var(--line);padding-top:6px}
.kp-b .kpl{margin:1px 0;white-space:pre-wrap}
.kp-b .kpl.ind{padding-left:1.5em}
/* 出處（簡報頁碼）：由 fmtBody() 從內文首行抽出，改放卡片右下角 */
.kp-b .kp-src{margin-top:8px;text-align:right;font-size:.8rem;color:var(--muted)}
/* 重點內文表格：notes.js 用純文字「A | B | C」連續多行書寫，由 fmtBody() 轉成表格 */
.kpt-w{overflow-x:auto;margin:6px 0}
.kpt{border-collapse:collapse;width:100%;font-size:.9rem}
.kpt th,.kpt td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.kpt th{background:var(--brand-soft);color:var(--brand);font-weight:700}
.kpt tbody td.c0{font-weight:700;background:#fafafa}   /* 第 1 欄＝標籤欄。用 class 不用 :first-child：
   第 1 欄被 rowspan 併掉的那幾列，第一個 <td> 會是第 2 欄，:first-child 會把它誤套成標籤欄樣式 */
/* 文字相同的相鄰儲存格由 fmtBody() 併成一格（上下 rowspan／左右 colspan），置中比較好讀 */
.kpt td[rowspan]{vertical-align:middle}
.kpt th[colspan],.kpt td[colspan]{text-align:center}
/* 只有「短標籤」才不換行；長敘述一律讓它折行，否則會把整張表撐爆（class 由 fmtBody() 依字數自動加） */
.kpt .nw{white-space:nowrap}
/* 首列全是「①②③…」＝一組並列項目排成的格狀清單，不是真表格：不套表頭與標籤欄的底色／粗體 */
.kpt.plain thead th{background:transparent;color:inherit;font-weight:400}
.kpt.plain tbody td.c0{background:transparent;font-weight:400}
/* ⚡ 快速記憶表：檔案端純文字，「…」由 cramEmph() 包成 .ck 上色 */
.cram .kp{border-left:3px solid var(--brand-soft);padding-left:10px;margin:14px 0}
.cram .kp-h{font-size:1rem;color:var(--brand)}
.cram .kpt{font-size:.88rem}
.cram-no{display:inline-block;min-width:24px;height:24px;line-height:24px;border-radius:6px;color:#fff;text-align:center;font-size:.85rem;margin-right:8px}
/* 🎯 歷史考題重點：版面沿用重點卡，另加小節出處列 */
.exam .kp{border-left:3px solid var(--brand-soft);padding-left:10px;margin:14px 0}
.exam .kp-h{font-size:1rem;color:var(--brand)}
.kp-sec{font-size:.78rem;color:var(--muted);margin-bottom:2px}
em.ck{font-style:normal;font-weight:700;color:#b91c1c}
/* 重點編輯器 */
.ed-h{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:6px}
.ed-b{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:.9rem;line-height:1.7;color:#374151;resize:vertical;min-height:70px}
.ed-h:focus,.ed-b:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.kp.recall{cursor:pointer}
.kp.recall .kp-b{display:none}
.kp.recall.show .kp-b{display:block}
.kp.recall:not(.show) .kp-h::after{content:"　👆 點我回想完看內容";font-weight:400;font-size:.78rem;color:var(--muted)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.page-tag{display:inline-block;background:#eef2ff;color:var(--brand);font-size:.75rem;padding:1px 9px;border-radius:6px;margin:14px 0 4px;font-weight:700}
.ptext p{margin-bottom:.6em;font-size:1rem}
.ptext p.bullet{padding-left:1.2em}
/* 重點標色快捷 class（在 notes.js 內文直接用 <span class="..."> 或 <mark>） */
.kp-b mark,.kp-b .hl{background:#fef08a;padding:0 2px;border-radius:3px}   /* 黃底螢光 */
.kp-b .hl-g{background:#bbf7d0;padding:0 2px;border-radius:3px}            /* 綠底 */
.kp-b .hl-r{background:#fecaca;padding:0 2px;border-radius:3px}           /* 紅底（陷阱/易錯） */
.kp-b .c-r,.kp-h .c-r{color:#b91c1c;font-weight:700}                     /* 紅字（標題與內文皆適用） */
.kp-b .c-b,.kp-h .c-b{color:#2563eb;font-weight:700}                     /* 藍字（標題與內文皆適用） */
/* 互動式螢光筆（標記模式）使用者標記 */
.uhl{border-radius:3px;padding:0 1px}
.uhl-y{background:#fde68a}.uhl-g{background:#bbf7d0}.uhl-b{background:#bfdbfe}.uhl-p{background:#fbcfe8}.uhl-k{background:#dcdfe4}
/* 標記模式：使用者「字樣」覆蓋——可蓋掉重點原有的粗體／紅字／藍字（存 localStorage，不寫檔） */
.kp-b .uf-b,.kp-h .uf-b{font-weight:800!important}                       /* 加粗（保留原本顏色） */
.kp-b .uf-r,.kp-h .uf-r{color:#b91c1c!important;font-weight:800!important}   /* 紅字：與 em.ck（「」關鍵字）同色 */
.kp-b .uf-l,.kp-h .uf-l{color:#2563eb!important;font-weight:800!important}
.kp-b .uf-e,.kp-h .uf-e{color:#009100!important;font-weight:800!important}
.kp-b .uf-n{font-weight:400!important;color:#374151!important}           /* 一般：取消粗體與顏色 */
.kp-h .uf-n{font-weight:400!important;color:var(--ink)!important}
.marking .kp-b,.marking .kp-h{cursor:text}
#hlbar{position:fixed;z-index:9999;display:none;flex-direction:column;gap:4px;padding:5px 7px;background:#1f2937;border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#hlbar .hlrow{display:flex;gap:5px;align-items:center}
#hlbar .hll{color:#d1d5db;font-size:.68rem;font-weight:700;width:1.5em;text-align:center;flex:none}
#hlbar button{width:22px;height:22px;border:2px solid #fff;border-radius:50%;cursor:pointer;padding:0;font-size:.8rem;line-height:1;font-family:inherit}
#hlbar button.er{background:#fff;color:#1f2937;font-weight:800;border-color:#9ca3af}
#hlbar button.fx{background:#fff;color:#111827;font-weight:800;font-size:.74rem;border-color:#9ca3af}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:.97rem;font-family:inherit}
.opt:hover{border-color:var(--brand)}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal{border-color:var(--ok);border-style:dashed}
.opt.picked{border-color:var(--brand);background:var(--brand-soft)}
.opt:disabled{cursor:default}
.expl{border-left:4px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:10px;font-size:.93rem}
.qmeta{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.ansmsg{margin-top:10px;padding:9px 14px;border-radius:8px;font-weight:700;font-size:.97rem;border:1.5px solid}
.ansmsg.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}
.ansmsg.bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
.anskey{background:var(--ok-soft);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:.95rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.83rem}
.due{color:var(--bad);font-weight:700}
.starbtn{background:none;border:0;padding:2px 6px;font-size:1.5rem;line-height:1;cursor:pointer;color:#cbd5e1;border-radius:8px;transition:transform .1s,color .15s}
.starbtn:hover{background:#f1f5f9;color:#f59e0b;transform:scale(1.1)}
.starbtn.on{color:#f59e0b}
@media(max-width:760px){.reader{grid-template-columns:1fr}.toc{position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <h1>📖 資通安全概論</h1>
  <button id="menutoggle" onclick="navOpen=!navOpen;render()">☰ 選單</button>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script>
// 帶時間戳記載入資料檔，避免瀏覽器快取舊題庫/書本資料（本機伺服器，重載無感）
document.write('<script src="data/units.js?v='+Date.now()+'"><\/script>');
document.write('<script src="data/quiz.js?v='+Date.now()+'"><\/script>');
document.write('<script src="data/quiz_renew.js?v='+Date.now()+'"><\/script>');
document.write('<script src="data/notes.js?v='+Date.now()+'"><\/script>');
document.write('<script src="data/notes_slide.js?v='+Date.now()+'"><\/script>');
document.write('<script src="data/slide_toc.js?v='+Date.now()+'"><\/script>');
document.write('<script src="data/cram.js?v='+Date.now()+'"><\/script>');
document.write('<script src="data/exam.js?v='+Date.now()+'"><\/script>');
</script>
<script>
/* ============ 狀態（localStorage） ============ */
const KEY='iics-study-v1';
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
// hl[hlid]=[{start,end,c}] 螢光筆底色｜fmt[hlid]=[{start,end,f}] 字樣覆蓋 f: b粗體/r紅字/l藍字/n一般（可蓋掉重點原有的粗體與顏色）
//   hlid＝「單元|小節|點序」（簡報版前綴 S），重點標題再加「|h」
// notesEdit[unit]=sections 陣列（使用者在網頁「編輯模式」改過的重點；本機保存）
// 題庫刪題後題目索引會前移，舊錯題記錄會指到別題（不會報錯，但複習到錯的題目）。
// 每次刪題就把 QUIZ_REV 加 1，並在 REV_DROP 列出受影響的索引範圍，載入時清掉該範圍的舊記錄。
// ⚠ 必須宣告在 normS() 首次呼叫之前，否則會踩到 const 的暫時性死區。
const QUIZ_REV=2;
const REV_DROP={                                // rev: [[單元, 起始qi, 結束qi], ...]
  1:[['6',41,41],['8',20,25]],
  2:[['4',7,44]],                               // v5：刪除單元4第8題，其後索引前移
};
let S=normS(load());
// 保存原始重點（供「還原」），並套用本機編輯覆蓋
// ⚠ 本機編輯會蓋掉檔案內容：若 Claude 之後更新了 notes.js，該單元仍會顯示舊的本機版。
//   因此這裡：①內容與檔案相同的「空編輯」直接清掉 ②真的有差異者記錄下來，於重點頁顯示提示條。
window.NOTES_LOCAL={};   // NOTES_LOCAL[uid]=true 表示該單元目前顯示的是本機編輯版、非檔案版
// 測驗(換證)：把 quiz_renew.js 併進 QUIZ，鍵值加前綴 R（R1～R9）。
// 這樣作答、錯題清單、間隔複習、★ 標記、依單元練習全部沿用既有引擎，不必另寫一套。
if(window.QUIZ&&window.QUIZ_RENEW)for(const u in QUIZ_RENEW)QUIZ['R'+u]=QUIZ_RENEW[u];
if(window.NOTES){
  window.NOTES_ORIG=JSON.parse(JSON.stringify(NOTES));
  let dropped=false;
  for(const uid in S.notesEdit){
    if(!NOTES[uid]){ continue; }
    if(JSON.stringify(S.notesEdit[uid])===JSON.stringify(NOTES_ORIG[uid].sections)){
      delete S.notesEdit[uid]; dropped=true;      // 與檔案一模一樣＝無意義的殘留，清掉
    }else{
      NOTES[uid].sections=S.notesEdit[uid];
      NOTES_LOCAL[uid]=true;
    }
  }
  if(dropped) save();
}
// 快速記憶表同樣支援本機編輯覆蓋（⚡ 快速記憶 → ✍️ 編輯模式）
window.CRAM_LOCAL={};    // CRAM_LOCAL[uid]=true 表示該單元目前顯示的是本機編輯版、非檔案版
if(window.CRAM){
  window.CRAM_ORIG=JSON.parse(JSON.stringify(CRAM));
  let dropped=false;
  for(const uid in S.cramEdit){
    if(!CRAM[uid]) continue;
    const title=(S.cramTitle||{})[uid];
    if(JSON.stringify(S.cramEdit[uid])===JSON.stringify(CRAM_ORIG[uid].blocks)
       &&(title==null||title===CRAM_ORIG[uid].title)){
      delete S.cramEdit[uid]; delete S.cramTitle[uid]; dropped=true;   // 與檔案一模一樣＝無意義的殘留
    }else{
      CRAM[uid].blocks=S.cramEdit[uid];
      if(title!=null)CRAM[uid].title=title;
      CRAM_LOCAL[uid]=true;
    }
  }
  if(dropped) save();
}

// 不再需要針對某一次改版寫死的一次性位移遷移（原 migrateMarks 已移除）。
// 舊版留下的 s.markRev 欄位不再使用，留著不影響。
function normS(s){   // 補齊缺欄位（舊版備份／匯入的檔案可能沒有 hl、fmt、notesEdit）
  s=s||{};
  s.units=s.units||{}; s.wrong=s.wrong||[]; s.history=s.history||[]; s.log=s.log||[];
  s.hl=s.hl||{}; s.fmt=s.fmt||{}; s.notesEdit=s.notesEdit||{};
  s.cramEdit=s.cramEdit||{}; s.cramTitle=s.cramTitle||{};   // 網頁「⚡ 快速記憶 → ✍️ 編輯模式」改過的區塊／單元名稱（本機保存）
  s.lastWrong=s.lastWrong||{};   // lastWrong[單元]={date,total,qis:[題號]}＝該單元最後一次完測答錯的題目（供「依單元練習錯題」使用）
  s.star=s.star||{};             // star[單元]=[題號]＝作答時按 ★ 手動加入練習的題目（不受完測覆寫影響）
  return migrateWrong(s);
}
function migrateWrong(s){
  const from=s.quizRev||0;
  if(from>=QUIZ_REV)return s;
  for(let r=from+1;r<=QUIZ_REV;r++){
    (REV_DROP[r]||[]).forEach(([uid,lo,hi])=>{
      s.wrong=s.wrong.filter(w=>!(String(w.uid)===uid&&w.qi>=lo&&w.qi<=hi));
    });
  }
  s.quizRev=QUIZ_REV;
  return s;
}

}

let notesUnit=1, recallMode=false, markMode=false, curSel=null, editMode=false;
// 主線重點自 2026-08-08 起本身就是簡報版，「🖥️ 簡報對照」切換鈕已移除，notesSrc 固定為 'book'。
// （notes_slide.js 與相關程式碼保留，之後若要恢復對照頁再把切換鈕加回來即可。）
let notesSrc='book';
// 取得目前來源的單元重點資料；簡報版無資料時回傳 null（由 vNotes 顯示提示卡）
function curNotes(uid){
  return notesSrc==='slide'
    ? (window.NOTES_SLIDE && NOTES_SLIDE[uid]) || null
    : (window.NOTES && NOTES[uid]) || null;
}
// 將重點內容逐行渲染：「標籤：」（行尾為冒號）為標頭齊頭，其下項目縮排一個字；
// 行內「標籤：內容」或一般敘述句維持齊頭。
function fmtBody(b){
  b=b.replace(/。\s*§/g,'。\n§');                       // 條文摘要：每個 §條文 自成一行
  const lines=b.split('\n');
  // 內文首行若以「簡報 X-XX」（可多個）開頭＝出處標註，抽出來改放卡片右下角；
  // 首行若在出處之後還有正文，正文留在原位。非首行提到的簡報頁碼是內文引用，不動。
  let src='';
  const sm=lines[0].match(/^((?:簡報\s*\d+-\d+(?:\s*[、，,]\s*)?)+)。?\s*/);
  if(sm){
    src=sm[1].replace(/[、，,\s]+$/,'');
    lines[0]=lines[0].slice(sm[0].length);
    if(!lines[0].trim()) lines.shift();
  }
  const isHeader=l=>/：$/.test(l);                       // 行尾冒號＝清單標頭
  const isTopLabel=l=>/^[^：＝（）「」『』\n]{1,16}：/.test(l); // 行內標籤＋內容＝頂層
  const isRow=l=>l.includes('|');                        // 半形直線分欄（全形｜不算，仍是一般文字）
  let inList=false, out='';
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    // 連續 2 行以上含「|」＝表格，首行為表頭
    if(isRow(l)&&i+1<lines.length&&isRow(lines[i+1])){
      const rows=[];
      while(i<lines.length&&isRow(lines[i])) rows.push(lines[i++].split('|').map(c=>c.trim()));
      i--;
      // 儲存格內的換行（四條規則，一律由渲染時處理，資料檔不要自己寫 <br>）：
      //   ①編輯模式在格內手動打「反斜線＋n」即換行（表格一行＝一列，不能按 Enter）
      //   ②「①②③」式條列有 2 項以上時，每項自動各自換行
      //   ③句號「。」後面還有字時自動換行（句號保留；句尾的不斷行）
      //   ④分號「；」「;」一律「拿掉符號」並換行（2026-08-24 使用者要求）
      // 先全部轉成佔位符 U+0001，最後再一次收斂成 <br>，避免規則重疊產生連續空行。
      const cellHTML=c=>{
        let s=String(c);
        s=s.replace(/\s*\\n\s*/g,'\u0001');                      // ① 手動換行標記
        s=s.replace(/\s*[；;]\s*/g,'\u0001');                     // ④ 分號：去掉符號並換行
        s=s.replace(/。\s*(?=\S)/g,'。\u0001');                   // ③ 句號：保留符號並換行
        if((s.match(/[①-⑳]/g)||[]).length>=2)
          s=s.replace(/\s*([①-⑳])/g,'\u0001$1');                  // ② 條列自動換行
        s=linkSlideRefs(s);
        return s.replace(/\u0001+/g,'<br>').replace(/^(?:<br>)+|(?:<br>)+$/g,'');
      };
      const cell=(c,t,rs,cs,ci)=>{
        const k=[]; if(c.length<=8)k.push('nw'); if(ci===0)k.push('c0');   // c0＝真正的第 1 欄（標籤欄樣式靠它，不靠 :first-child）
        return `<${t}${k.length?' class="'+k.join(' ')+'"':''}${rs>1?' rowspan="'+rs+'"':''}${cs>1?' colspan="'+cs+'"':''}>${cellHTML(c)}</${t}>`;
      };
      // 文字完全相同的相鄰儲存格自動合併，先左右（colspan）再上下（rowspan）：
      //   ・左右＝同一列相鄰且文字相同（2026-08-26 新增；表頭列也適用）。
      //     但「✔／－」這類單一字元的格子不做左右合併，否則 A/B/C 分級表會失去對欄，
      //     且 C 級的「－」會跟同為「－」的備註欄黏在一起。
      const hOK=t=>String(t).trim().length>1;             // 長度 1 的符號格不左右合併
      //   ・上下＝同一欄相鄰且文字相同，免得像「① 人員定義與適任性查核」這種
      //     分組標籤在每一列重複出現；需左右寬度一致才併，否則表格會歪掉。
      //     第 2 欄以後只有在左邊那一欄也被「上下」併掉時才跟著併，避免不相干的列被誤併。
      // hid：0＝照常輸出、1＝被左邊的格吃掉（colspan）、2＝被上面的格吃掉（rowspan）
      // 首列每一格都以「①②③…」開頭＝並列清單排成的格子，沒有表頭也沒有標籤欄 → 全部畫成素表
      const plain=rows[0].length>1&&rows[0].every(c=>/^[①-⑳]/.test(String(c).trim()));
      const hd=rows[0], hcs=hd.map(()=>1), hhid=hd.map(()=>0);
      for(let c=0;c<hd.length;c++){
        if(hhid[c]) continue;
        if(!hOK(hd[c])) continue;
        for(let k=c+1;k<hd.length&&hd[k]===hd[c];k++){ hhid[k]=1; hcs[c]++; }
      }
      const body=rows.slice(1);
      const cs=body.map(r=>r.map(()=>1)), rs=body.map(r=>r.map(()=>1)), hid=body.map(r=>r.map(()=>0));
      for(let r=0;r<body.length;r++)                       // ① 左右合併
        for(let c=0;c<body[r].length;c++){
          if(hid[r][c]||!hOK(body[r][c])) continue;
          for(let k=c+1;k<body[r].length&&body[r][k]===body[r][c];k++){ hid[r][k]=1; cs[r][c]++; }
        }
      for(let c=0;c<(body[0]||[]).length;c++)              // ② 上下合併
        for(let r=0;r<body.length;r++){
          if(body[r][c]===undefined||hid[r][c]) continue;
          for(let k=r+1;k<body.length&&body[k][c]===body[r][c]&&!hid[k][c]
                        &&cs[k][c]===cs[r][c]&&(c===0||hid[k][c-1]===2);k++){
            hid[k][c]=2; rs[r][c]++;
          }
        }
      out+='<div class="kpt-w"><table class="kpt'+(plain?' plain':'')+'"><thead><tr>'
        +hd.map((c,ci)=>hhid[ci]?'':cell(c,'th',1,hcs[ci],ci)).join('')+'</tr></thead><tbody>'
        +body.map((r,ri)=>'<tr>'+r.map((c,ci)=>hid[ri][ci]?'':cell(c,'td',rs[ri][ci],cs[ri][ci],ci)).join('')+'</tr>').join('')
        +'</tbody></table></div>';
      inList=false; continue;
    }
    let cls='kpl';
    if(isHeader(l)) inList=true;
    else if(isTopLabel(l)) inList=false;
    else if(inList) cls='kpl ind';
    out+=`<div class="${cls}">${linkSlideRefs(l)}</div>`;   // 內文允許寫 HTML（標色/底色），不跳脫；簡報頁碼轉為跳頁連結
  }
  return out+(src?`<div class="kp-src">${linkSlideRefs(src)}</div>`:'');
}

/* ---- 標記錨定（2026-08-15） ----------------------------------------------
   問題：標記原本只存 {start,end} 字元位移。只要重點內文或渲染方式一改
   （Claude 重新生成 notes.js、出處「簡報 X-XX」被移到卡片右下角、重點增刪順序變動…），
   位移就整段偏掉，標記全部標到不相干的字上。
   作法：每段標記另存 t＝被標的文字本身、p＝前面 12 個字的脈絡、ht＝所屬重點標題。
   每次渲染先 healAllMarks()：①原位對得上就直接用 ②對不上就用 t 在同一條重點裡重新定位
   ③連重點都被搬走了，就找同單元中標題相同的那條 ④真的找不到＝孤兒，標記留著但不畫。
   舊資料沒有 t（本次改版前存的），改用「區塊／標點邊界評分」自動試出整條重點的位移量。 */
const MARK_CTX=12;
const markKind=id=>id.endsWith('|h');               // true＝標題、false＝內文（重新定位時不互相混用）
function markTitleOf(id){
  const el=document.querySelector('[data-hlid="'+(markKind(id)?id:id+'|h')+'"]');
  return el?el.textContent:null;
}
function markAnchor(text,r,title){                  // 依目前位移補記文字錨點
  r.t=text.slice(r.start,r.end);
  r.p=text.slice(Math.max(0,r.start-MARK_CTX),r.start);
  if(title!=null)r.ht=title;
  delete r.lost;
}
const markFits=(text,r)=>!!r.t&&r.end-r.start===r.t.length&&text.substr(r.start,r.t.length)===r.t;
// 在 text 中找 r.t 最可能的位置：優先前文脈絡也吻合者，其次離原位移最近者
function markFind(text,r){
  if(!r.t)return -1;
  let i=text.indexOf(r.t), best=-1, bs=-Infinity;
  while(i>=0){
    const sc=(r.p&&text.slice(Math.max(0,i-r.p.length),i)===r.p?1e6:0)-Math.abs(i-r.start);
    if(sc>bs){bs=sc;best=i}
    i=text.indexOf(r.t,i+1);
  }
  return best;
}
function healAllMarks(){
  const els=[...document.querySelectorAll('.kp-h[data-hlid],.kp-b[data-hlid]')]
    .map(el=>({id:el.dataset.hlid,el,text:el.textContent}));
  if(!els.length)return;                            // 不在重點頁
  const byId=new Map(els.map(e=>[e.id,e]));
  const pres=markPres();
  let dirty=false;
  for(const bag of [S.hl,S.fmt]){
    const moves=[];                                 // [range, 新的 hlid]：重點順序變動時整段搬家
    for(const id of Object.keys(bag)){
      if(!inPres(id,pres))continue;                 // 只校正目前畫面上的單元
      const ranges=bag[id]||[]; if(!ranges.length)continue;
      const cur=byId.get(id), title=markTitleOf(id), keep=[];
      const legacy=ranges.filter(r=>!r.t);          // 舊資料：整條重點一起試位移
      if(cur&&legacy.length){
        markAlign(cur,legacy);
        legacy.forEach(r=>markAnchor(cur.text,r,title));
        dirty=true;
      }
      for(const r of ranges){
        if(cur&&markFits(cur.text,r)){ if(r.lost){delete r.lost;dirty=true} keep.push(r); continue }
        const at=cur?markFind(cur.text,r):-1;       // ②同一條重點裡重新定位
        if(at>=0){ r.start=at; r.end=at+r.t.length; markAnchor(cur.text,r,title); dirty=true; keep.push(r); continue }
        let alt=null, ap=-1;                        // ③重點被搬到別的位置：找標題相同的那條
        if(r.ht)for(const e of els){
          if(e.id===id||markKind(e.id)!==markKind(id)||markTitleOf(e.id)!==r.ht)continue;
          const p=markFind(e.text,r); if(p>=0){alt=e;ap=p;break}
        }
        if(alt){ r.start=ap; r.end=ap+r.t.length; markAnchor(alt.text,r,r.ht); moves.push([r,alt.id]); dirty=true; continue }
        if(!r.lost){r.lost=1;dirty=true}            // ④找不到＝內容真的被改掉了，留著但不畫
        keep.push(r);
      }
      if(keep.length)bag[id]=keep; else delete bag[id];
    }
    for(const [r,to] of moves)(bag[to]=bag[to]||[]).push(r);
  }
  if(dirty)save();
}
// 區塊邊界（每個 div／td／th 的起訖字元位置）——使用者的標記多半起於行首、止於行尾或標點
function markEdges(el){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  const starts=new Set([0]), ends=new Set(); let pos=0, prev=null;
  while(w.nextNode()){
    const n=w.currentNode, b=(n.parentElement&&n.parentElement.closest('div,td,th,li,p'))||el;
    if(b!==prev){ starts.add(pos); if(prev)ends.add(pos); prev=b; }
    pos+=n.length;
  }
  ends.add(pos);
  return {starts,ends};
}
const MK_PUNC=/[。，、；：！？）〕」』】…—－\s]/, MK_WORD=/[A-Za-z0-9]/, MK_CLOSE=/[。，、；：！？）」』】]/;
function markScore(text,edges,ranges,s){            // 位移 s 後，各段標記的起訖有多「像人選的」
  let sc=0;
  for(const r of ranges){
    const a=r.start+s, b=r.end+s;
    if(a<0||b>text.length||a>=b)return -Infinity;
    if(edges.starts.has(a))sc+=4; else if(a===0||MK_PUNC.test(text[a-1]))sc+=2;
    if(MK_WORD.test(text[a-1]||'')&&MK_WORD.test(text[a]))sc-=6;   // 切在英數字中間＝幾乎不可能
    if(MK_CLOSE.test(text[a]))sc-=3;                               // 從句號、右括號起頭＝不像
    if(edges.ends.has(b))sc+=4; else if(MK_PUNC.test(text[b-1]))sc+=2;
    if(MK_WORD.test(text[b-1]||'')&&MK_WORD.test(text[b]||''))sc-=6;
  }
  return sc;
}
// 舊標記自動對齊：整條重點的標記一起平移，取評分最高（同分取位移最小）的那個
function markAlign(cur,ranges){
  const edges=markEdges(cur.el);
  let best=0, bs=markScore(cur.text,edges,ranges,0);
  for(let d=1;d<=120;d++)for(const s of [-d,d]){
    const sc=markScore(cur.text,edges,ranges,s);
    if(sc>bs){bs=sc;best=s}
  }
  if(best)ranges.forEach(r=>{r.start+=best;r.end+=best});
  return best;
}
// ranges: [{start,end,k}]，k＝要套的 class 字串
function hlPaint(el,ranges){
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  const nodes=[]; let pos=0;
  while(walker.nextNode()){const n=walker.currentNode;nodes.push({node:n,start:pos,end:pos+n.length});pos+=n.length;}
  for(const it of nodes){
    const segs=[];
    for(const r of ranges){const s=Math.max(r.start,it.start),e=Math.min(r.end,it.end);if(s<e)segs.push({s:s-it.start,e:e-it.start,k:r.k});}
    if(!segs.length)continue;
    segs.sort((a,b)=>a.s-b.s);
    const text=it.node.textContent, frag=document.createDocumentFragment(); let cur=0;
    for(const sg of segs){
      if(sg.s>cur)frag.appendChild(document.createTextNode(text.slice(cur,sg.s)));
      const sp=document.createElement('span'); sp.className=sg.k; sp.textContent=text.slice(sg.s,sg.e); frag.appendChild(sp);
      cur=Math.max(cur,sg.e);
    }
    if(cur<text.length)frag.appendChild(document.createTextNode(text.slice(cur)));
    it.node.parentNode.replaceChild(frag,it.node);
  }
}
// 取得目前選取相對於 container 純文字的起訖位置（uhl span 不含字元，offset 與儲存值一致）
function getSelOffsets(container){
  const sel=window.getSelection(); if(!sel||!sel.rangeCount)return null;
  const range=sel.getRangeAt(0);
  if(!container.contains(range.startContainer)||!container.contains(range.endContainer))return null;
  const pre=range.cloneRange(); pre.selectNodeContents(container); pre.setEnd(range.startContainer,range.startOffset);
  const start=pre.toString().length, text=range.toString();
  if(!text.trim())return null;
  return {start, end:start+text.length};
}
function handleSel(e){
  if(!markOn())return;
  if(e&&e.target&&e.target.closest&&e.target.closest('#hlbar'))return;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount){hideBar();return}
  let node=sel.getRangeAt(0).commonAncestorContainer;
  if(node.nodeType===3)node=node.parentElement;
  const container=node&&node.closest?node.closest('.kp-b[data-hlid],.kp-h[data-hlid]'):null;
  if(!container||!container.dataset.hlid){hideBar();return}
  const off=getSelOffsets(container);
  if(!off){hideBar();return}
  curSel={hlid:container.dataset.hlid, start:off.start, end:off.end};
  showBar(sel.getRangeAt(0).getBoundingClientRect());
}
function showBar(rect){
  let bar=document.getElementById('hlbar');
  if(!bar){
    bar=document.createElement('div'); bar.id='hlbar';
    bar.innerHTML=
      `<div class="hlrow"><span class="hll">底</span>`
      +HLPAL.map(([c,col,lbl])=>`<button title="${lbl}底" style="background:${col}" onclick="hlAdd('${c}')"></button>`).join('')
      +`<button class="er" title="清除底色" onclick="hlErase()">✕</button></div>`
      +`<div class="hlrow"><span class="hll">字</span>`
      +FMTPAL.map(([f,lbl,tip])=>`<button class="fx" title="${tip}" onclick="fmtAdd('${f}')">${lbl}</button>`).join('')
      +`<button class="er" title="取消我的字樣設定（還原成原檔樣式）" onclick="fmtErase()">↺</button></div>`;
    document.body.appendChild(bar);
  }
  bar.style.display='flex';
  const bw=bar.offsetWidth||160, bh=bar.offsetHeight||64;
  let left=rect.left+rect.width/2-bw/2, top=rect.top-bh-8;
  left=Math.max(8,Math.min(left,innerWidth-bw-8));
  if(top<8)top=rect.bottom+8;                              // 上方放不下 → 改放選取範圍下方
  top=Math.max(8,Math.min(top,innerHeight-bh-8));          // 一律夾在畫面內（選到頁面底部時才不會被切掉）
  bar.style.left=left+'px'; bar.style.top=top+'px';
}
function hideBar(){const b=document.getElementById('hlbar');if(b)b.style.display='none';curSel=null}
// 從範圍陣列挖掉 [s,e) 這一段（兩側殘段保留）——讓使用者能只改一小段，不會弄丟同一句其餘的標記
function cutRanges(arr,s,e){
  const out=[];
  for(const r of arr){
    if(r.end<=s||r.start>=e){out.push(r);continue}
    if(r.start<s)out.push(Object.assign({},r,{end:s}));
    if(r.end>e)out.push(Object.assign({},r,{start:e}));
  }
  return out;
}
// 套用後保留選取範圍，讓使用者可以連按（底色→字樣）；重繪後用純文字位置重新選回來
function reselect(){
  if(!curSel)return;
  const el=document.querySelector('[data-hlid="'+curSel.hlid+'"]'); if(!el)return;
  const at=off=>{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let pos=0;
    while(w.nextNode()){const n=w.currentNode; if(off<=pos+n.length)return{node:n,offset:off-pos}; pos+=n.length;}
    return null;
  };
  const a=at(curSel.start), b=at(curSel.end); if(!a||!b)return;
  const r=document.createRange(); r.setStart(a.node,a.offset); r.setEnd(b.node,b.offset);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  showBar(r.getBoundingClientRect());
}
function markApply(store,key,val){
  if(!curSel)return;
  const keep=curSel;                                    // render() 會重繪，先留著選取位置
  const el=document.querySelector('[data-hlid="'+keep.hlid+'"]');
  const arr=cutRanges(store[keep.hlid]||[],keep.start,keep.end);
  if(val)arr.push(Object.assign({start:keep.start,end:keep.end},{[key]:val}));
  // 補記文字錨點：新的一段要記，被切開的殘段起訖變了也要重記，之後內文改動才追得回來
  if(el){const title=markTitleOf(keep.hlid); arr.forEach(r=>markAnchor(el.textContent,r,title));}
  if(arr.length)store[keep.hlid]=arr; else delete store[keep.hlid];
  save(); render();
  curSel=keep; reselect();
}

/* ---- 一鍵清除標記（底色＋字樣一起清） ---- */
// scope: 'unit'＝目前畫面上的單元（見 markPres）｜'all'＝全部（重點＋簡報對照＋快速記憶）
function markIds(scope){
  const keys=new Set([...Object.keys(S.hl||{}),...Object.keys(S.fmt||{})]);
  if(scope==='all')return [...keys];
  const pres=markPres();
  return [...keys].filter(k=>inPres(k,pres));
}
function markCount(scope){   // 標記「處數」＝底色段數＋字樣段數
  return markIds(scope).reduce((n,k)=>n+((S.hl[k]||[]).length)+((S.fmt[k]||[]).length),0);
}
function markLost(scope){    // 找不到原文、暫時不顯示的標記處數
  return markIds(scope).reduce((n,k)=>
    n+((S.hl[k]||[]).filter(r=>r.lost).length)+((S.fmt[k]||[]).filter(r=>r.lost).length),0);
}

// 自動對齊：丟掉錨點，讓 healAllMarks() 重跑「邊界評分」替每條重點各自算最佳位移
function autoAlignMarks(){
  const ids=markIds('unit');
  if(!ids.length){alert('本單元沒有標記。');return}
  if(!confirm('自動對齊「'+markScopeLabel()+'」的標記？\n\n會依標點與行首行尾，替每一段各自推算正確位移。\n對齊後若還差一兩個字，可用「微調」左右挪。'))return;
  for(const k of ids)for(const bag of [S.hl,S.fmt])
    (bag[k]||[]).forEach(r=>{delete r.t;delete r.p;delete r.lost});
  save(); hideBar(); render();
}
// 微調：本單元所有標記整體左右挪 d 個字（挪完立刻重記錨點，之後才不會又被自動定位拉回去）
function nudgeMarks(d){
  const texts=new Map([...document.querySelectorAll('.kp-h[data-hlid],.kp-b[data-hlid]')]
    .map(el=>[el.dataset.hlid,el.textContent]));
  let moved=0;
  for(const k of markIds('unit')){
    const text=texts.get(k); if(text==null)continue;
    const title=markTitleOf(k);
    for(const bag of [S.hl,S.fmt])(bag[k]||[]).forEach(r=>{
      const a=r.start+d, b=r.end+d;
      if(a<0||b>text.length||a>=b)return;
      r.start=a; r.end=b; markAnchor(text,r,title); moved++;
    });
  }
  if(!moved){alert('已經到頭了，沒有標記可以再挪。');return}
  save(); hideBar(); render();
}
function clearLostMarks(){
  const n=markLost('unit');
  if(!n){alert('本單元沒有失效的標記。');return}
  if(!confirm('清掉本單元 '+n+' 處「找不到原文」的標記？\n\n這些是內文被改寫後對不回去的標記，無法復原。'))return;
  for(const k of markIds('unit'))for(const bag of [S.hl,S.fmt]){
    const arr=(bag[k]||[]).filter(r=>!r.lost);
    if(arr.length)bag[k]=arr; else delete bag[k];
  }
  save(); hideBar(); render();
}
function clearMarks(scope){
  const ids=markIds(scope), n=markCount(scope);
  if(!n){alert('目前沒有標記可以清除。');return;}
  const label=scope==='all'?'全部（重點＋簡報對照＋⚡ 快速記憶＋🎯 歷史考題）':markScopeLabel();
  if(!confirm(`確定清除「${label}」的標記？\n\n共 ${n} 處（螢光筆底色＋字樣調整）一併清掉，無法復原。\n重點／快速記憶內容、測驗成績與進度都不受影響。`))return;
  for(const k of ids){delete S.hl[k];delete S.fmt[k];}
  save(); hideBar(); render();   // 用 render 不用 nav：從「📊 記錄」頁按也留在原頁
}

addEventListener('scroll',()=>{
  const bar=document.getElementById('hlbar');

  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed){hideBar();return}

  showBar(r);
},{passive:true});

function toggleStar(uid,qi){
  uid=String(uid);

  if(i>=0)arr.splice(i,1); else arr.push(qi);

// 某單元「最後一次完測」答錯的題目；沒有完測紀錄時，暫時退回用錯題清單
function drillSet(uid){
  uid=String(uid);
  const ok=qi=>QUIZ[uid]&&QUIZ[uid][qi];
  const rec=(S.lastWrong||{})[uid];
  const stars=((S.star||{})[uid]||[]).filter(ok);
  const base=rec?(rec.qis||[]).filter(ok)
                :S.wrong.filter(w=>String(w.uid)===uid&&ok(w.qi)).map(w=>w.qi);
  const qis=[...new Set([...base,...stars])].sort((a,b)=>a-b);
  return {src:rec?'test':'list',date:rec&&rec.date,total:rec&&rec.total,qis,base:base.length,stars:stars.length};
}
function drillCount(uid){return drillSet(uid).qis.length}
// 有題庫的所有單元代號：一般 1～9 ＋ 換證 R1～R9
function drillUnits(){
  const a=BOOK.units.map(u=>String(u.id));
  for(const u of BOOK.units)if((QUIZ['R'+u.id]||[]).length)a.push('R'+u.id);
  return a;
}
// 單元錯題練習：把該單元最後一次完測的錯題整批再練一次，不受到期日限制，可重複練
function startDrill(uid){
  pruneWrong();
  const units=uid==='all'?drillUnits():[String(uid)];
  const list=[];
  for(const u of units)for(const qi of drillSet(u).qis)list.push({uid:u,qi});
  if(!list.length){alert(uid==='all'?'目前沒有可練習的錯題（先完成一次單元測驗吧）。':uLabel(uid)+' 目前沒有可練習的錯題。');return;}
  const items=list.map(w=>({uid:w.uid,qi:w.qi,q:shufOpts(QUIZ[w.uid][w.qi]),w}));
  shuffle(items);
  quizSession={mode:'drill',uid,items,idx:0,correct:0,answered:false,picks:[],results:[]};
  cur=uid!=='all'&&isR(uid)?'quiz2':'quiz';render();
}
/* 作答結果提示：色弱使用者只看顏色分不出對錯，所以一律附文字與圖示。 */
function ansBanner(ss,q){
  const L='ABCDEF';
  if(ss.ok)return '<div class="ansmsg ok" role="status">✅ 答對</div>';
  const key=Array.isArray(q.ans)?q.ans.map(i=>L[i]).join('、'):L[q.ans];
  const hint=Array.isArray(q.ans)?'（虛線框＝應選未選）':'';
  return `<div class="ansmsg bad" role="status">❌ 答錯，正解為 ${key}${hint}</div>`;
}
function vQuizQ(){
  const ss=quizSession;
  if(ss.idx>=ss.items.length)return vQuizDone();
  const it=ss.items[ss.idx], q=it.q;
  let html=`<div class="card">
    <div class="row spread"><span class="badge ${ss.mode==='quiz'?'b-blue':'b-warn'}">${sessLabel(ss)}</span>
    <div class="row" style="gap:8px"><span class="muted">第 ${ss.idx+1} / ${ss.items.length} 題</span>
      <button class="starbtn ${starred(it.uid,it.qi)?'on':''}" onclick="toggleStar('${it.uid}',${it.qi})"
        title="${starred(it.uid,it.qi)?'已加入「📚 依單元練習錯題」，點一下取消':'把這題加入「📚 依單元練習錯題」重複練習'}"
        aria-label="標記此題加入練習">${starred(it.uid,it.qi)?'★':'☆'}</button></div></div>
    <div class="bar"><div style="width:${Math.round(ss.idx/ss.items.length*100)}%"></div></div>
    <div class="qmeta">${q.type==='multi'?'<span class="badge b-warn">複選題</span>　選出所有正確答案後按「送出」，需全部選對':'<span class="badge b-blue">單選題</span>'}</div>
    <h3 style="margin:10px 0">${esc(q.q)}</h3>`;
  const L='ABCDEF';
  if(q.type==='multi'){
    const ansArr=q.ans;
    html+=q.opts.map((o,i)=>{
      let cls='opt',click='';
      if(ss.answered){
        const isAns=ansArr.includes(i),picked=ss.picks.includes(i);
        if(isAns)cls+=picked?' sel-ok':' reveal';
        else if(picked)cls+=' sel-bad';
      }else{
        if(ss.picks.includes(i))cls+=' picked';
        click=`onclick="togglePick(${i})"`;
      }
      return `<button class="${cls}" ${ss.answered?'disabled':''} ${click}>${L[i]}. ${esc(o)}</button>`;
    }).join('');
    if(!ss.answered)html+=`<div style="margin-top:10px"><button class="act" ${ss.picks.length?'':'disabled'} onclick="answerMulti()">送出答案</button></div>`;
    else html+=ansBanner(ss,q)+`<div class="expl">📖 ${linkSlideRefs(q.ref)}　${esc(q.expl||'')}</div>`;
  }else{
    html+=q.opts.map((o,i)=>{
      let cls='opt',dis=ss.answered?'disabled':'';
      if(ss.answered){if(i===q.ans)cls+=ss.pick===i?' sel-ok':' reveal';else if(i===ss.pick)cls+=' sel-bad'}
      return `<button class="${cls}" ${dis} onclick="answerMC(${i})">${L[i]}. ${esc(o)}</button>`;
    }).join('');
    if(ss.answered)html+=ansBanner(ss,q)+`<div class="expl">📖 ${linkSlideRefs(q.ref)}　${esc(q.expl||'')}</div>`;
  }
  if(ss.answered)html+=`<div style="margin-top:12px"><button class="act" onclick="nextQ()">下一題 →</button></div>`;
  return html+'</div>';
}
function answerMC(i){
  const ss=quizSession;if(ss.answered)return;
  ss.answered=true;ss.pick=i;
  ss.ok=(i===ss.items[ss.idx].q.ans);
  record(ss.items[ss.idx], ss.ok);
  render();
}
function togglePick(i){
  const ss=quizSession;if(ss.answered)return;
  ss.picks=ss.picks.includes(i)?ss.picks.filter(x=>x!==i):[...ss.picks,i];
  render();
}
function answerMulti(){
  const ss=quizSession;if(ss.answered||!ss.picks.length)return;
  ss.answered=true;
  const ans=[...ss.items[ss.idx].q.ans].sort().join(),got=[...ss.picks].sort().join();
  ss.ok=(ans===got);
  record(ss.items[ss.idx], ss.ok);
  render();
}
function record(it,ok){
  const ss=quizSession;
  if(ok)ss.correct++;
  ss.results.push({uid:it.uid,qi:it.qi,ok});
  // 📚 依單元練習錯題：純練習，完全不動錯題清單與間隔複習排程。
  // 練習題目來自「該單元最後一次完測」的錯題，只有再完測一次該單元才會換一批。
  if(ss.mode==='drill')return;
  const found=S.wrong.find(w=>w.uid===it.uid&&w.qi===it.qi);
  if(!ok){
    if(found){found.streak=0;found.due=addDays(today(),1)}
    else S.wrong.push({uid:it.uid,qi:it.qi,due:addDays(today(),1),streak:0});
  }else if(found){
    found.streak=(found.streak||0)+1;
    if(found.streak>=2)S.wrong=S.wrong.filter(w=>w!==found);   // 連續兩次答對 → 移除
    else found.due=addDays(today(),[3,7,14][Math.min(found.streak,2)]);
  }
  save();
}
function nextQ(){const ss=quizSession;ss.idx++;ss.answered=false;ss.pick=null;ss.picks=[];ss.ok=null;render()}
function sessLabel(ss){
  if(ss.mode==='review')return '🔁 錯題複習';
  if(ss.mode==='drill')return ss.uid==='all'?'📚 錯題練習（全部單元）':'📚 '+uLabel(ss.uid)+' 錯題練習';
  return uLabel(ss.uid)+' 測驗';
}
function vQuizDone(){
  const ss=quizSession;
  const pct=Math.round(ss.correct/ss.items.length*100);
  if(ss.mode==='quiz'){
    const st=ustate(ss.uid);
    if(st.best===null||pct>st.best)st.best=pct;
    S.history.push({date:today(),uid:ss.uid,score:ss.correct,total:ss.items.length});
    // 覆寫該單元的「最後一次完測錯題」——📚 依單元練習錯題永遠練這一批，直到下次完測
    S.lastWrong[ss.uid]={date:today(),total:ss.items.length,qis:ss.results.filter(r=>!r.ok).map(r=>r.qi)};
    save();
  }
  const wrongN=ss.items.length-ss.correct, dUid=ss.uid;
  const msg=pct===100?'💯 全對！':pct>=80?'👍 不錯，錯題已排入複習':pct>=60?'📌 及格邊緣，建議重讀後再測':'⚠️ 建議回到閱讀頁重讀本單元';
  const html=`<div class="card" style="text-align:center;padding:36px">
    <div style="font-size:2.6rem;font-weight:800;color:${pct>=80?'var(--ok)':pct>=60?'var(--warn)':'var(--bad)'}">${pct}%</div>
    <div style="margin:6px 0">${ss.correct} / ${ss.items.length} 題正確　${msg}</div>
    ${ss.mode==='drill'
      ? `<div class="muted">練習模式<b>不會</b>改動錯題清單與複習排程${wrongN?`（本輪答錯 ${wrongN} 題）`:''}；作答時按 ★ 可把題目長期留在這份練習清單裡。
         這批題目固定是${dUid==='all'?'各單元':uLabel(dUid)+' '}<b>最後一次完測</b>的錯題，再完測一次該單元才會換新。</div>`
      : wrongN?`<div class="muted">答錯的 ${wrongN} 題已加入複習排程（明天到期）${ss.mode==='quiz'?`；「📚 依單元練習錯題」的${uLabel(ss.uid)}已更新為本次錯的 ${wrongN} 題`:''}</div>`
        :(ss.mode==='quiz'?`<div class="muted">全對！「📚 依單元練習錯題」的${uLabel(ss.uid)}已清空</div>`:'')}
    <div class="row" style="justify-content:center;margin-top:16px;flex-wrap:wrap">
      ${ss.mode==='quiz'?`<button class="ghost" onclick="startQuiz(${uArg(ss.uid)})">再測一次</button>`:''}
      ${ss.mode==='drill'?`<button class="act" onclick="startDrill(${typeof dUid==='number'?dUid:"'"+dUid+"'"})">🔁 再練一次（重新洗牌）</button>
        <button class="ghost" onclick="quizSession=null;nav('review')">回複習頁</button>`:''}
      <button class="${ss.mode==='drill'?'ghost':'act'}" onclick="quizSession=null;nav('dash')">回儀表板</button>
    </div></div>`;
  quizSession=null;
  return html;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
/* 作答時連「選項順序」一起打散（ans 跟著換），避免記位置不記內容。
   回傳題目的淺複本，QUIZ 原始資料完全不動。
   前提是解析不得引用 A/B/C/D 字母——兩套題庫已於 2026-08-29 全面清乾淨。 */
function shufOpts(q){
  const idx=q.opts.map((_,i)=>i);
  shuffle(idx);
  const back=[];idx.forEach((old,now)=>{back[old]=now});   // 原索引 → 新索引
  return {...q,
    opts:idx.map(i=>q.opts[i]),
    ans:Array.isArray(q.ans)?q.ans.map(i=>back[i]).sort((x,y)=>x-y):back[q.ans]};
}

/* ============ 複習 ============ */
function vReview(){
  const due=dueWrongs(), future=S.wrong.filter(w=>w.due>today()).sort((a,b)=>a.due<b.due?-1:1);
  let html=`<div class="card"><h2>🔁 錯題複習（間隔重複）</h2>
    <div class="muted" style="margin-bottom:10px">答錯 → 隔天再考；答對 → 間隔拉長（3、7、14 天）；連續兩次答對 → 畢業移除。</div>
    ${due.length?`<button class="act" onclick="startReview()">開始複習 ${due.length} 題到期錯題</button>`:'<span class="badge b-ok">今天沒有到期錯題 🎉</span>'}</div>`;
  // 依單元重複練習錯題：來源＝該單元「最後一次完測」的錯題，與間隔複習排程完全脫鉤
  pruneWrong();
  let totalD=0, anyFallback=false;
  const pillFor=uid=>{
    const d=drillSet(uid), n=d.qis.length, t=BOOK.units.find(x=>String(x.id)===uNum(uid));
    totalD+=n;
    if(d.src==='list'&&n)anyFallback=true;
    const tip=(d.src==='test'
      ? `${d.date} 完測 ${d.total} 題，錯 ${d.base} 題`
      : (d.base?'尚未完測過，暫時取自錯題清單（'+d.base+' 題）':'尚未完測，也沒有錯題記錄'))
      +(d.stars?`；另有 ★ 標記 ${d.stars} 題`:'');
    return `<button class="ghost sm" ${n?'':'disabled'} title="${esc(t?t.title:'')}｜${tip}"
      onclick="startDrill(${uArg(uid)})">單元 ${uNum(uid)}（${n}${d.src==='list'&&n?' ＊':''}）</button>`;
  };
  let pills=BOOK.units.map(u=>pillFor(u.id)).join('');
  const rPills=drillUnits().filter(isR).map(pillFor).join('');
  html+=`<div class="card"><h3>📚 依單元練習錯題</h3>
    <div class="muted" style="font-size:.86rem;margin-bottom:10px">題目來源＝該單元<b>最後一次「完整測驗」答錯的題目</b>，加上你在作答時按 <b>★</b> 標記的題目，想練幾次就練幾次。
      <br>這裡<b>不套用</b>間隔重複規則（不看到期日、不累積連對、不會畢業移除），練習結果也不會改動上方的錯題清單與複習排程。
      <br>要換一批題目，就把該單元的測驗<b>再完整做一次</b>——完測結束時會自動用該次的錯題覆寫這裡。</div>
    <div class="row" style="flex-wrap:wrap;gap:6px">${pills}</div>
    ${rPills?`<div class="muted" style="font-size:.82rem;margin-top:10px">📝 測驗(換證)</div>
      <div class="row" style="flex-wrap:wrap;gap:6px">${rPills}</div>`:''}
    <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
      <button class="act sm" ${totalD?'':'disabled'} onclick="startDrill('all')">📚 全部單元一起練（${totalD} 題）</button>
      <button class="ghost sm" ${starCount()?'':'disabled'} onclick="clearStars()">☆ 清除全部 ★ 標記（${starCount()} 題）</button>
    </div>
    ${anyFallback?'<div class="muted" style="font-size:.8rem;margin-top:8px">＊ 該單元尚未完整測驗過，暫時改用「錯題清單」的題目；完測一次之後就會改成完測結果。</div>':''}
    </div>`;
  if(S.wrong.length){
    html+=`<div class="card"><h3>錯題清單（${S.wrong.length} 題）</h3><table>
      <tr><th>到期日</th><th>單元</th><th>題目</th><th>連對</th></tr>`;
    for(const w of [...due,...future]){
      const q=QUIZ[w.uid]&&QUIZ[w.uid][w.qi];if(!q)continue;
      html+=`<tr><td class="${w.due<=today()?'due':''}">${w.due}</td><td>${uLabel(w.uid)}</td>
        <td>${esc(q.q.slice(0,42))}…</td><td>${w.streak||0}/2</td></tr>`;
    }
    html+='</table></div>';
  }
  return html;
}

/* ============ 記錄 ============ */
function vStats(){
  let html=`<div class="card"><div class="row spread"><h2>📊 測驗記錄</h2>
    <div class="row"><button class="ghost sm" onclick="expData()">匯出進度</button>
    <button class="ghost sm" onclick="document.getElementById('imp').click()">匯入進度</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="impData(this)">
    <button class="ghost sm" style="color:var(--bad);border-color:var(--bad)" onclick="clearWrong()">清除錯題</button>
    <button class="ghost sm" style="color:var(--bad);border-color:var(--bad)" onclick="clearMarks('all')">清除全部重點標記（${markCount('all')} 處）</button>
    ${localUnits().length?`<button class="ghost sm" style="color:var(--warn);border-color:var(--warn)" onclick="noteRevertAll()">↩️ 全部改用檔案版重點（${localUnits().length} 單元）</button>`:''}
    <button class="ghost sm" style="color:var(--bad);border-color:var(--bad)" onclick="clearAll()">清除全部記錄</button></div></div>`;
  if(!S.history.length)html+='<div class="muted">尚無測驗記錄。</div>';
  else{
    html+='<table><tr><th>日期</th><th>單元</th><th>成績</th></tr>';
    for(const h of [...S.history].reverse())
      html+=`<tr><td>${h.date}</td><td>${uLabel(h.uid)}</td><td>${h.score}/${h.total}（${Math.round(h.score/h.total*100)}%）</td></tr>`;
    html+='</table>';
  }
  return html+`</div><div class="card"><h3>⚠️ 資料說明</h3><div class="muted">進度存在這台電腦的瀏覽器（localStorage）。換電腦或清瀏覽器資料前，請先「匯出進度」備份。<br>📌 <b>「匯出／匯入」也包含「📌重點」裡『標記模式』的螢光筆底色與字樣調整（粗體／紅字／藍字／一般）</b>，換裝置可帶著走；惟若之後重點文字有更新，已標記處的位置可能對不準。<br>🗑️ <b>「清除全部記錄」只清測驗相關資料</b>，你的標記與網頁內編輯的重點會保留。</div></div>`;
}
function clearWrong(){
  if(!S.wrong.length){alert('目前沒有錯題記錄。');return;}
  if(!confirm('確定清除「錯題清單」共 '+S.wrong.length+' 題？（測驗成績與單元進度保留）'))return;
  S.wrong=[];save();render();
}
function clearAll(){
  if(!confirm('確定清除「全部記錄」？包含測驗成績、錯題清單、各單元已讀/最佳成績，且無法復原。建議先「匯出進度」備份。\n\n（你的重點標記與網頁內編輯的重點會保留）'))return;
  S=normS({hl:S.hl, fmt:S.fmt, notesEdit:S.notesEdit});   // 只清測驗相關；標記與本機編輯保留
  save();render();
}
function expData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='iics-progress-'+today()+'.json';a.click();
}
function impData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{S=normS(JSON.parse(r.result));save();render();alert('匯入完成')}catch(e){alert('檔案格式錯誤')}};
  r.readAsText(f);
}
render();
</script>
</body>
